# Test configuration: in-memory H2 instead of PostgreSQL, dummy Plaid keys.
spring.datasource.url=jdbc:h2:mem:cashmatrix;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-only-secret-test-only-secret-test-only-secret-1234
jwt.expiration-ms=3600000

plaid.client-id=test
plaid.secret=test
plaid.env=sandbox

# Tests trigger reminders themselves so the background job stays out of the way.
app.reminders.enabled=false

# Tests sync by hand, never in the background.
app.sync.enabled=false

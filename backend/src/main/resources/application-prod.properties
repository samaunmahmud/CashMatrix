# --- Server ---
server.port=${PORT:8080}

# --- Database ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# --- Plaid ---
plaid.client-id=${PLAID_CLIENT_ID}
plaid.secret=${PLAID_SECRET}
plaid.env=${PLAID_ENV:sandbox}
plaid.country-codes=${PLAID_COUNTRY_CODES:GB}

# --- App ---
# The frontend's address: allowed to call the API, used for email links and passkeys.
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}

# --- Email (only used once SPRING_MAIL_HOST is set) ---
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
